<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flowchart</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
<div id="div1" class="parentDiv">
   <div class="move" onmouseover="moveElement(id)" id="divMove1">::<br>::</div>
  <label for="header1"></label>
  <input value="Flowchart Tool!" class="header" type="text" id="header1" style="width: 440px">
  <br>
  <label for="button1"></label>
  <textarea id="button1" style="width: 440px; height: 66px">Hit the "N" key to make a new element at your mouse position. Hit the "L" key to connect two elements, and "Escape" to cancel. Hit "Delete" or "Backspace" to delete the element you're hovering over.</textarea>
</div>
<div id="div_add">
  <button id="add" type="button" onclick="add(false)">+</button>
</div>
<button type="button" onclick="connections()">Click here to draw a line!</button>
<script src="./js/app.js"></script>
</body>
</html>
